name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Python the daily scan runs on.
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        # The suite is offline: SEC/Piotroski arithmetic on made-up numbers and
        # price shaping against a stubbed yfinance. No keys, no network.
        run: python -m pytest -q

      - name: Verify the CLI loads and reports its usage
        run: python scout.py --help > /dev/null
