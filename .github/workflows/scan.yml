name: daily-scan

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC Mon–Fri, after the US market closes
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan the market
        env:
          # Optional repo secret: "Your Name your@email.com" (SEC asks bots to identify themselves)
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scout.py scan
      - name: Commit results
        run: |
          git config user.name "stock-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports stocks data docs
          git diff --cached --quiet || git commit -m "Scan $(date -u +%Y-%m-%d)"
          git push
